name: Saturday Weekly Scheduler

on:
  schedule:
    # Times configured in UTC for Asia/Kolkata (IST = UTC + 5:30)
    # Saturday 11:00 AM IST -> 05:30 UTC
    - cron: '30 5 * * 6'
    # Saturday 4:00 PM IST (16:00) -> 10:30 UTC
    - cron: '30 10 * * 6'
    # Saturday 6:00 PM IST (18:00) -> 12:30 UTC
    - cron: '30 12 * * 6'
    # Saturday 8:00 PM IST (20:00) -> 14:30 UTC
    - cron: '30 14 * * 6'

  # Supports manual invocation and testing from the GitHub Actions dashboard
  workflow_dispatch:
    inputs:
      action:
        description: 'Scheduler checkpoint action to run'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - remind_11am
          - remind_4pm
          - remind_6pm
          - generate_report
      target_url:
        description: 'Override target application URL (optional)'
        required: false
        default: ''

concurrency:
  group: saturday-scheduler
  cancel-in-progress: false

jobs:
  run-scheduler:
    name: Run Weekly Scheduler Checkpoint
    runs-on: ubuntu-latest

    steps:
      - name: Determine Target Action
        id: determine-action
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL_ACTION="${{ github.event.inputs.action }}"
          
          if [ -n "$MANUAL_ACTION" ] && [ "$MANUAL_ACTION" != "" ]; then
            SELECTED_ACTION="$MANUAL_ACTION"
            TRIGGER_REASON="manual_dispatch"
          elif [ "$SCHEDULE" = "30 5 * * 6" ]; then
            SELECTED_ACTION="remind_11am"
            TRIGGER_REASON="scheduled_saturday_11am_ist"
          elif [ "$SCHEDULE" = "30 10 * * 6" ]; then
            SELECTED_ACTION="remind_4pm"
            TRIGGER_REASON="scheduled_saturday_4pm_ist"
          elif [ "$SCHEDULE" = "30 12 * * 6" ]; then
            SELECTED_ACTION="remind_6pm"
            TRIGGER_REASON="scheduled_saturday_6pm_ist"
          elif [ "$SCHEDULE" = "30 14 * * 6" ]; then
            SELECTED_ACTION="generate_report"
            TRIGGER_REASON="scheduled_saturday_8pm_ist"
          else
            SELECTED_ACTION="auto"
            TRIGGER_REASON="fallback_auto"
          fi

          echo "action=$SELECTED_ACTION" >> $GITHUB_OUTPUT
          echo "reason=$TRIGGER_REASON" >> $GITHUB_OUTPUT
          echo "Action: $SELECTED_ACTION"
          echo "Trigger Source: $TRIGGER_REASON"

      - name: Validate Secrets and Target URL
        id: validate
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL || github.event.inputs.target_url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Missing target application URL. Please configure APP_URL in your GitHub repository Secrets or Variables (e.g. https://your-project.vercel.app)."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing CRON_SECRET. Please configure CRON_SECRET in your GitHub repository Secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${APP_URL%/}"
          echo "target_url=$CLEAN_URL" >> $GITHUB_OUTPUT

      - name: Execute Weekly Scheduler Checkpoint
        env:
          TARGET_URL: ${{ steps.validate.outputs.target_url }}
          ACTION: ${{ steps.determine-action.outputs.action }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          ENDPOINT="${TARGET_URL}/api/cron/weekly-scheduler?action=${ACTION}"
          echo "Calling weekly scheduler checkpoint..."
          echo "Target endpoint path: /api/cron/weekly-scheduler?action=${ACTION}"

          # Invoke endpoint securely without exposing authorization headers or tokens
          RESPONSE=$(curl -s -S -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${ENDPOINT}")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Saturday scheduler checkpoint completed successfully."
          else
            echo "::error::Weekly scheduler returned failure status code $HTTP_STATUS"
            exit 1
          fi
